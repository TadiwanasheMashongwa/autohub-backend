spring.application.name=autohub
server.port=${PORT:8080}

# --- Database Connection ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:autohubdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# --- Connection Pooling (Hikari Optimization) ---
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
# How long a thread waits for a connection before failing (30s is default, 20s is safer here)
spring.datasource.hikari.connection-timeout=20000
# Max time a connection can sit idle
spring.datasource.hikari.idle-timeout=300000
# Max lifetime of a connection in the pool
spring.datasource.hikari.max-lifetime=1200000

# --- Task Execution (Async Pool Configuration) ---
# This controls the threads used by @Async EmailService
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=autohub-async-

# --- Gmail SMTP ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${AUTOHUB_MAIL_USERNAME}
spring.mail.password=${AUTOHUB_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Timeout for the actual mail server connection to prevent the 20s hang
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Performance: Compression ---
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# --- Swagger UI & OpenAPI Fixes ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-query-params=true
springdoc.swagger-ui.operationsSorter=method

# --- Logistics & Payment Configuration ---
app.payment.webhook-secret=ah_secret_9922_service_sync