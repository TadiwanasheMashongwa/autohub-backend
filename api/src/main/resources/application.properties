spring.application.name=autohub
server.port=${PORT:8080}

# Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:autohubdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# Connection Pooling
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# Gmail SMTP - Secured via Environment Variables
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${AUTOHUB_MAIL_USERNAME}
spring.mail.password=${AUTOHUB_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Performance: Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Swagger UI & OpenAPI Fixes
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-query-params=true
springdoc.swagger-ui.operationsSorter=method