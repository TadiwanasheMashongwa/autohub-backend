spring.application.name=autohub
server.port=${PORT:8080}

# --- Database Connection (Railway Cloud) ---
# We use direct injection to avoid accidental fallbacks to H2 RAM
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Persistence Logic ---
# 'update' keeps your Railway data safe; it only adds new columns/tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# --- Connection Tuning (Remote Cloud Sync) ---
# Increased timeout to 30s to handle the journey to the Railway servers
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000

# --- Task Execution (Async Pool) ---
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.thread-name-prefix=autohub-async-

# --- Gmail SMTP ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${AUTOHUB_MAIL_USERNAME}
spring.mail.password=${AUTOHUB_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Swagger UI & OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Logistics & Payment ---
app.payment.webhook-secret=ah_secret_9922_service_sync