spring.application.name=autohub
server.port=${PORT:8080}

# Database Connection (Optimized for Railway)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Defer initialization to ensure tables exist before data loads
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# Connection Pooling
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Gmail SMTP (Zimbabwe Market Notifications)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Performance: Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Swagger UI & OpenAPI Fixes
# 1. Define the internal path where JSON documentation is generated
springdoc.api-docs.path=/v3/api-docs
# 2. Define the URL for the UI itself
springdoc.swagger-ui.path=/swagger-ui.html
# 3. UI Display Settings
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# 4. CRITICAL: Force the UI to load the local spec instead of the Petstore
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config